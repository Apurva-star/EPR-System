{% extends "base.html" %}

{% block title %}
Login - EPR System
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h2 class="fw-bold">Login</h2>
                    <p class="text-muted">
                        Login to your EPR System account
                    </p>
                </div>

                <!-- Login Form -->
                <form method="POST" action="/login">

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <!-- Remember me -->
                    <div class="form-check mb-3">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="remember"
                            name="remember"
                        >

                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <!-- Login Button -->
                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Login
                        </button>
                    </div>

                </form>

                <!-- Register Link -->
                <div class="text-center mt-4">
                    <p class="mb-0">
                        Don't have an account?
                        <a href="/register" class="text-decoration-none">
                            Register
                        </a>
                    </p>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
