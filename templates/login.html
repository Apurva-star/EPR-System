<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form method="post">
        {{ form.hidden_tag() }}
        <p>{{ form.email.label }} {{ form.email() }}{% for error in form.email.errors %}<span>{{ error }}</span>{% endfor %}</p>
        <p>{{ form.password.label }} {{ form.password() }}{% for error in form.password.errors %}<span>{{ error }}</span>{% endfor %}</p>
        <p>{{ form.submit() }}</p>
    </form>
    <p><a href="{{ url_for('register') }}">Register</a></p>
</body>
</html>
